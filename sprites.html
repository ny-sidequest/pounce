<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pounce sprites (dev)</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=VT323&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #0B0A1A; color: #F4E7C3; font-family: 'VT323', monospace; font-size: 20px; }
  h1 { font-family: 'Pixelify Sans', monospace; margin: 12px 16px 0; font-size: 22px; }
  h2 { font-family: 'Pixelify Sans', monospace; margin: 18px 16px 6px; font-size: 18px; color: #FFB238; }
  .grid { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 12px 12px; }
  .tile { display: grid; grid-template-columns: auto auto; gap: 0; border: 2px solid #3A3666; }
  .tile .cap { grid-column: 1 / 3; background: #120F2B; padding: 0 6px; font-size: 18px; display: flex; justify-content: space-between; }
  .bg { padding: 6px; display: grid; place-items: center; }
  .night { background: #120F2B; } .grey { background: #8a8a8a; }
  canvas { display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<h1>POUNCE sprites · every animation at 4× on the night and on mid-grey</h1>
<div id="root"></div>
<script type="module">
import { SpritePlayer } from './js/sprites.js';
import { CAT } from './js/sprite-cat.js';
import { THIEF } from './js/sprite-thief.js';
const scale = Number(new URLSearchParams(location.search).get('s')) || 4;
const root = document.getElementById('root');
function section(title, sprite, names) {
  const h = document.createElement('h2'); h.textContent = title; root.appendChild(h);
  const grid = document.createElement('div'); grid.className = 'grid'; root.appendChild(grid);
  for (const name of names) {
    const a = sprite.anims[name];
    const tile = document.createElement('div'); tile.className = 'tile';
    tile.innerHTML = `<div class="cap"><span>${name}</span><span>${a.frames.length}f · ${a.fps}fps${a.loop ? ' · loop' : ''}</span></div>`;
    for (const cls of ['night', 'grey']) {
      const bg = document.createElement('div'); bg.className = 'bg ' + cls;
      const c = document.createElement('canvas'); bg.appendChild(c); tile.appendChild(bg);
      const p = new SpritePlayer(c, sprite, { scale });
      const loopIt = () => p.play(name, { onComplete: () => setTimeout(loopIt, 500) });
      loopIt();
    }
    grid.appendChild(tile);
  }
}
const catMoves = Object.keys(CAT.anims).filter((n) => !n.startsWith('title_') && !n.endsWith('_blink'));
const catTitles = Object.keys(CAT.anims).filter((n) => n.startsWith('title_'));
section('Cat · actions', CAT, catMoves);
section('Cat · title poses', CAT, catTitles);
section('Thief · actions', THIEF, Object.keys(THIEF.anims));
</script>
</body>
</html>
