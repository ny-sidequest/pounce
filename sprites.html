<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pounce sprites: old vs hi-bit (dev)</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=VT323&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #0B0A1A; color: #F4E7C3; font-family: 'VT323', monospace; font-size: 20px; }
  h1 { font-family: 'Pixelify Sans', monospace; margin: 12px 16px 0; font-size: 22px; }
  p.note { margin: 4px 16px 0; color: #8B86B8; font-size: 18px; }
  h2 { font-family: 'Pixelify Sans', monospace; margin: 18px 16px 6px; font-size: 18px; color: #FFB238; }
  .list { display: grid; gap: 8px; padding: 0 12px 16px; }
  .row { border: 2px solid #3A3666; background: #120F2B; }
  .cap { padding: 0 8px; display: flex; justify-content: space-between; font-size: 18px; }
  .cells { display: flex; flex-wrap: wrap; gap: 0; align-items: flex-end; }
  .cell { display: grid; justify-items: center; padding: 6px 8px 4px; }
  .cell small { font-size: 15px; color: #8B86B8; margin-top: 2px; }
  .night { background: #120F2B; } .grey { background: #8a8a8a; }
  .cell.grey small { color: #222; }
  canvas { display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<h1>POUNCE sprites · old (32×24 / 28×44) vs hi-bit (64×48 / 56×88)</h1>
<p class="note">Sizes are real CSS pixels. Phone = the new art at 1 px per art pixel (same physical size as the old art, twice the detail). Tablet 2 px, desktop 3 px.</p>
<div id="root"></div>
<script type="module">
import { SpritePlayer } from './js/sprites.js';
import { CAT } from './js/sprite-cat.js';
import { THIEF } from './js/sprite-thief.js';
import { CAT_HI } from './js/sprite-cat-hi.js';
import { THIEF_HI } from './js/sprite-thief-hi.js';
const root = document.getElementById('root');
const CELLS = [
  { label: 'old as shipped (phone ≈2×)', old: true, scale: 2, bg: 'night' },
  { label: 'new ×1 · phone', scale: 1, bg: 'night' },
  { label: 'new ×1 grey', scale: 1, bg: 'grey' },
  { label: 'new ×2 · tablet', scale: 2, bg: 'night' },
  { label: 'new ×2 grey', scale: 2, bg: 'grey' },
  { label: 'new ×3 · desktop', scale: 3, bg: 'night' }
];
function section(title, oldS, newS, names) {
  const h = document.createElement('h2'); h.textContent = title; root.appendChild(h);
  const list = document.createElement('div'); list.className = 'list'; root.appendChild(list);
  for (const name of names) {
    const a = newS.anims[name]; const o = oldS.anims[name];
    const row = document.createElement('div'); row.className = 'row';
    row.innerHTML = `<div class="cap"><span>${name}</span><span>old ${o ? o.frames.length : '–'}f → new ${a.frames.length}f · ${a.fps}fps${a.loop ? ' · loop' : ''}</span></div>`;
    const cells = document.createElement('div'); cells.className = 'cells'; row.appendChild(cells);
    for (const c of CELLS) {
      const sprite = c.old ? oldS : newS;
      if (!sprite.anims[name]) continue;
      const cell = document.createElement('div'); cell.className = 'cell ' + c.bg;
      const cv = document.createElement('canvas'); cell.appendChild(cv);
      const sm = document.createElement('small'); sm.textContent = c.label; cell.appendChild(sm);
      cells.appendChild(cell);
      const p = new SpritePlayer(cv, sprite, { scale: c.scale });
      const loopIt = () => p.play(name, { onComplete: () => setTimeout(loopIt, 500) });
      loopIt();
    }
    list.appendChild(row);
  }
}
const moves = (s) => Object.keys(s.anims).filter((n) => !n.startsWith('title_') && !n.endsWith('_blink'));
section('Cat · actions', CAT, CAT_HI, moves(CAT_HI));
section('Cat · title poses', CAT, CAT_HI, Object.keys(CAT_HI.anims).filter((n) => n.startsWith('title_')));
section('Thief · actions', THIEF, THIEF_HI, moves(THIEF_HI));
</script>
</body>
</html>
