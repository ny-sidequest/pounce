<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=VT323&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/styles.css"></head>
<body><div id="toast" class="toast" role="status"></div><div id="app"></div>
<script type="module">
import { createScene } from './js/scene.js';
import { rainHTML } from './js/pixel.js';
import { homeHTML } from './js/home.js';
import { renderResults } from './js/results.js';
import * as E from './js/engine.js';
const data = await (await fetch('data/puzzles.json')).json();
const P = data.puzzles;
const app = document.getElementById('app');
const f = new URLSearchParams(location.search).get('f') || '1';
const toast = (t) => { const el = document.getElementById('toast'); el.textContent = t; el.classList.add('show'); };

const pips = (arr) => arr.map((s) => `<li class="pip ${s}"><span>${s === 'miss' ? '×' : ''}</span></li>`).join('');
const hud = (left, arr, score) => `<header class="hud">
  <div class="hud-box hud-leap ${left.cls || ''}"><span class="lab">${left.lab}</span><span class="val ${left.state ? 'state' : ''}">${left.val}</span></div>
  <ol class="pips">${pips(arr)}</ol><div class="hud-box hud-score"><span class="lab">SCORE</span><span class="val">${score}</span></div></header>`;
const question = (n, q, t = '14.3', p = 0.7, tries = '') => `<div class="qpanel"><div class="q-meta"><span class="q-num">CLUE ${n} OF 5</span><span class="timer-num">${t}</span></div>
  <div class="strand" style="--p:${p}"><div class="strand-fill"></div></div><p class="q-text">${q}</p>
  <form class="answer-form"><input placeholder="type your answer"><button class="btn btn-amber" type="button">GO</button></form><p class="tries">${tries}</p></div>`;
const game = (title, left, arr, score, panel, setup, home = false) => {
  app.innerHTML = `${rainHTML()}<section class="screen game"><div class="topline"><button class="icon-btn" style="${home ? '' : 'visibility:hidden'}">‹</button><h1 class="pz-name">${title}</h1><button class="icon-btn off">SND</button></div>
   ${hud(left, arr, score)}<div id="sc" style="display:contents"></div><div class="panel">${panel}</div></section>`;
  const sc = createScene(document.getElementById('sc'));
  setup(sc);
  return sc;
};
const A = P[0].clues, N3 = P[2].clues;
const play = (puzzleId, steps) => { let p = E.startQuestion(E.newProgress(puzzleId)); steps.forEach((s, i) => { p = E.resolveQuestion(p, s.q); if (s.pounce) p = E.resolvePounce(E.openPounce(p), s.pounce); if (i < steps.length - 1) p = E.nextClue(p); }); return p; };

const frames = {
  '1': () => { app.innerHTML = homeHTML([
      { id: 1, state: 'caught', name: 'Breaking Bad', score: '7,676', title: 'Alley genius', from: '4.0 m' },
      { id: 2, state: 'away', score: '4,409', title: 'Bin diver' },
      { id: 3, state: 'new' }]); },
  '1b': () => { app.innerHTML = homeHTML([{ id: 1, state: 'new' }, { id: 2, state: 'new' }, { id: 3, state: 'new' }]); },
  '2': () => game('NIGHT #1', { lab: 'GAP', val: '5.0m' }, ['current', '', '', '', ''], '0', question(1, A[0].q, '18.6', .93), (s) => { s.setCatRoof(0); }),
  '3': () => game('NIGHT #1', { lab: 'GAP', val: '4.0m' }, ['done', 'done', 'current', '', ''], '1,976', question(3, A[2].q, '12.4', .62, '2 TRIES LEFT'), (s) => { s.lightLamp(0, 'RV', false, false); s.lightLamp(1, 'Pollo', false, false); s.setLight(2); s.setCatRoof(1); }),
  '4': () => { const sc = game('NIGHT #1', { lab: 'GAP', val: '4.0m' }, ['done', 'done', '', '', ''], '1,976', '', (s) => { s.lightLamp(0, 'RV', false, false); s.lightLamp(1, 'Pollo', false, false); s.setLight(2); s.setCatRoof(1, 'wiggle'); s.dim(true); });
      document.body.insertAdjacentHTML('beforeend', `<div class="static-dlg"><div class="dlg-box pounce-box"><h2>Who's under the mask?</h2><p class="pb-sub">A 4.0m leap · worth <b>4,000</b> · one shot</p>
        <div class="q-meta"><span class="q-num">TIME TO LEAP</span><span class="timer-num">28.8</span></div><div class="strand" style="--p:.95"><div class="strand-fill"></div></div>
        <form class="answer-form"><input placeholder="Name the thief"><button class="btn btn-neon" type="button">LEAP ▸</button></form><p class="pb-msg"></p><button class="link-btn">Not yet</button></div></div>`); },
  '5': () => { game('NIGHT #1', { lab: '', val: 'CAUGHT', cls: 'caught', state: 1 }, ['done', 'done', 'current', '', ''], '5,976', `<div class="break"><p class="heads-up">Heads up: the remaining clues are general knowledge, not about the thief.</p><button class="btn btn-amber">GOT IT ▸</button></div>`, (s) => { s.lightLamp(0, 'RV', false, false); s.lightLamp(1, 'Pollo', false, false); s.setLight(2); s.showUnmasking(); }); toast('Caught from 4.0m! Alley genius.'); },
  '5b': () => { game('NIGHT #1', { lab: '', val: 'CAUGHT', cls: 'caught', state: 1 }, ['done', 'done', 'current', '', ''], '5,976', question(3, A[2].q, '16.0', .8), (s) => { s.lightLamp(0, 'RV', false, false); s.lightLamp(1, 'Pollo', false, false); s.setLight(2); s.showCaught(P[0].connect.answer); }); },
  '6': () => game('NIGHT #1', { lab: 'GAP', val: '4.0m' }, ['done', 'done', '', '', ''], '1,976', '', (s) => { s.lightLamp(0, 'RV', false, false); s.lightLamp(1, 'Pollo', false, false); s.setLight(2); s.showTumble('tumble2'); }),
  '6b': () => { game('NIGHT #1', { lab: 'GAP', val: '4.0m' }, ['done', 'done', '', '', ''], '1,976', `<div class="break"><h2 class="break-title">CLATTER! The thief got away.</h2><p class="break-sub">You fell short at 4.0m. The mask stays on.</p><button class="btn btn-amber">Climb out →</button></div>`, (s) => { s.lightLamp(0, 'RV', false, false); s.lightLamp(1, 'Pollo', false, false); s.setLight(2); s.showInBin(1); }); toast('CLATTER! The thief got away.'); },
  '7': () => game('NIGHT #1', { lab: '', val: 'ON FOOT', cls: 'foot', state: 1 }, ['done', 'done', 'miss', 'current', ''], '1,976', question(4, A[3].q, '15.2', .76), (s) => { s.lightLamp(0, 'RV', false, false); s.lightLamp(1, 'Pollo', false, false); s.lightLamp(2, 'New Mexico', true, false); s.setLight(2); s.showOnFoot(2); }),
  '8': () => { const p = play(3, [{ q: { status: 'correct', time: 3.2 } }, { q: { status: 'correct', time: 2.9 }, pounce: { correct: true, guess: 'rdj' } }, { q: { status: 'correct', time: 4.1 } }, { q: { status: 'missed' } }, { q: { status: 'correct', time: 2.8 } }]);
      renderResults(app, P[2], p, { onHome() {}, shareText: "Pounce · Night #3 · Alley genius\n✅⚡🐾✅✅❌⚡\nCaught the thief from 4.0m · 7,676\nWho's under the mask? → pounce.io" }); },
  '9': () => { const p = play(1, [{ q: { status: 'correct', time: 4 }, pounce: { correct: false, guess: 'toy story' } }, { q: { status: 'correct', time: 5 } }, { q: { status: 'missed' } }, { q: { status: 'correct', time: 3.2 } }, { q: { status: 'correct', time: 4.4 } }]);
      renderResults(app, P[0], p, { onHome() {}, shareText: "Pounce · Night #1 · Bin diver\n✅🐾❌✅❌✅✅\nThe thief got away · 3,630\nWho's under the mask? → pounce.io" }); },
  '10': () => { const p = play(2, Array.from({ length: 5 }, (_, i) => ({ q: { status: i === 2 ? 'missed' : 'correct', time: 4 } }))); renderResults(app, P[1], E.skipFinal(p), { onHome() {}, shareText: 'Pounce · Night #2 · Scaredy cat\n✅✅❌✅✅\nNever leapt · 3,500\nWho\'s under the mask? → pounce.io' }); }
};
frames[f]();
</script></body></html>
