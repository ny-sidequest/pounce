<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pounce · vector style spike</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=VT323&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: #0B0A1A; color: #F4E7C3; font-family: 'VT323', monospace; font-size: 20px; display: flex; flex-direction: column; overflow: hidden; }
  header { padding: 8px 12px 4px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  h1 { margin: 0; font: 700 18px 'Pixelify Sans', monospace; letter-spacing: .04em; }
  .sub { color: #8B86B8; font-size: 17px; }
  #stage { position: relative; flex: 1 1 0; min-height: 0; margin: 0 10px; border: 2px solid #3A3666; background: #120F2B; overflow: hidden; }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #beat { position: absolute; left: 8px; top: 6px; font-size: 20px; color: #FFB238; background: rgba(5,4,12,.7); padding: 0 8px; pointer-events: none; }
  #plate { position: absolute; left: 50%; top: 9%; transform: translate(-50%, -30px); opacity: 0; width: min(88%, 420px); text-align: center; background: #120F2B; border: 3px solid #FFB238; box-shadow: 4px 4px 0 #05040C; padding: 8px 12px; transition: opacity .25s, transform .3s cubic-bezier(.3,1.4,.5,1); pointer-events: none; }
  #plate.show { opacity: 1; transform: translate(-50%, 0); }
  #plate .k { color: #FFB238; letter-spacing: .2em; font-size: 20px; }
  #plate .n { font: 700 clamp(22px, 5vw, 32px) 'Pixelify Sans', monospace; line-height: 1.1; }
  #plate .p { color: #FFB238; font-size: 44px; line-height: .9; }
  #plate .t { font: 700 20px 'Pixelify Sans', monospace; }
  #plate.fall .k { color: #FF4F9A; }
  #controls { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 10px 10px; }
  button { font: 700 16px 'Pixelify Sans', monospace; letter-spacing: .03em; color: #F4E7C3; background: #120F2B; border: 2px solid #3A3666; box-shadow: 3px 3px 0 #05040C; min-height: 44px; padding: 0 14px; cursor: pointer; }
  button.on { background: #FFB238; color: #05040C; border-color: #05040C; }
  button.go { background: #FF4F9A; color: #05040C; border-color: #05040C; }
  #sheetwrap { position: fixed; inset: 0; z-index: 50; background: rgba(5,4,12,.96); display: none; overflow: auto; }
  #sheetwrap.show { display: block; }
  #sheetwrap button { position: fixed; right: 10px; top: 10px; z-index: 51; }
  #sheet { display: block; max-width: 100%; }
</style>
</head>
<body>
<header><h1>POUNCE · vector style spike</h1><span class="sub">rigged SVG characters, code-driven at 60fps · timings from js/sequences.js</span></header>
<div id="stage">
  <svg id="scene" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" preserveAspectRatio="xMidYMax slice"></svg>
  <div id="beat"></div>
  <div id="plate"><div class="k"></div><div class="n"></div><div class="p"></div><div class="t"></div></div>
</div>
<div id="controls">
  <button id="bCatch" class="go">▶ Catch</button>
  <button id="bFall" class="go">▶ Fall</button>
  <button id="bLoop" class="on">Loop: on</button>
  <button id="bSlow">Slow-mo: off</button>
  <button id="bStrip">Leap strip</button>
</div>
<div id="sheetwrap"><button id="bClose">Close</button><canvas id="sheet"></canvas></div>
<script type="module" src="js/vector-spike.js"></script>
</body>
</html>
